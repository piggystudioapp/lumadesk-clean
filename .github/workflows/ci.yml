name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0 # keep in step with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run unit tests
        run: cargo test --locked
      - name: Build Windows release
        run: cargo build --release --locked
      - name: Package portable preview
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Verify package installation and data preservation
        shell: pwsh
        run: ./scripts/test-package.ps1 -Archive (Get-ChildItem dist/LumaDesk-*-windows-x64.zip | Select-Object -First 1 -ExpandProperty FullName)
      - uses: actions/upload-artifact@v4
        with:
          name: LumaDesk-windows-x64
          path: |
            dist/LumaDesk-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
